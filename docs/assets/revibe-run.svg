<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1240" role="img" aria-labelledby="title desc">
  <title id="title">REVibe controller-led run loop</title>
  <desc id="desc">Five readable steps show how REVibe receives a request, delegates scoped work, verifies evidence, reviews one decision, and advances or reruns from durable state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#1a2942"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1000" height="1240" rx="32" fill="url(#bg)"/>
  <circle cx="76" cy="74" r="7" fill="#a7f3d0"/>
  <text x="100" y="84" fill="#a7f3d0" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" letter-spacing="2">REVIBE  /  CONTINUOUS RUN</text>
  <text x="60" y="150" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="46" font-weight="750">One controller. Clear handoffs.</text>
  <text x="60" y="194" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="24">Every answer becomes state before the next stage begins.</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <g><rect x="60" y="250" width="880" height="145" rx="24" fill="#f8fafc"/><rect x="60" y="250" width="12" height="145" rx="6" fill="#0ea5e9"/><text x="105" y="295" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="1">01  REQUEST</text><text x="105" y="345" fill="#0f172a" font-size="34" font-weight="700">/revibe &lt;task&gt;</text><text x="105" y="378" fill="#475569" font-size="21">create a new isolated run</text></g>
    <g><rect x="60" y="455" width="880" height="145" rx="24" fill="#e0f2fe"/><rect x="60" y="455" width="12" height="145" rx="6" fill="#38bdf8"/><text x="105" y="500" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="1">02  CONTROLLER</text><text x="105" y="550" fill="#0f172a" font-size="34" font-weight="700">assign bounded work</text><text x="105" y="583" fill="#475569" font-size="21">choose lanes and available workers</text></g>
    <g><rect x="60" y="660" width="880" height="145" rx="24" fill="#ede9fe"/><rect x="60" y="660" width="12" height="145" rx="6" fill="#8b5cf6"/><text x="105" y="705" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="1">03  WORKERS</text><text x="105" y="755" fill="#0f172a" font-size="34" font-weight="700">do the scoped work</text><text x="105" y="788" fill="#475569" font-size="21">return evidence packets to the controller</text></g>
    <g><rect x="60" y="865" width="880" height="145" rx="24" fill="#dcfce7"/><rect x="60" y="865" width="12" height="145" rx="6" fill="#22c55e"/><text x="105" y="910" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="1">04  VERIFY + REVIEW</text><text x="105" y="960" fill="#0f172a" font-size="34" font-weight="700">check, then ask one decision</text><text x="105" y="993" fill="#475569" font-size="21">name the subject, evidence, and impact</text></g>
    <g><rect x="60" y="1070" width="880" height="110" rx="24" fill="#fef3c7"/><rect x="60" y="1070" width="12" height="110" rx="6" fill="#f59e0b"/><text x="105" y="1113" fill="#0f172a" font-size="21" font-weight="800" letter-spacing="1">05  PERSIST + ROUTE</text><text x="105" y="1158" fill="#0f172a" font-size="30" font-weight="700">save → rerun, pause, or advance</text></g>
  </g>
  <g stroke="#67e8f9" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M500 395v50"/><path d="M500 600v50"/><path d="M500 805v50"/><path d="M500 1010v50"/></g>
  <path d="M940 1125H970V225H30V322H60" stroke="#67e8f9" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <rect x="60" y="1195" width="880" height="2" fill="#3b526d"/>
  <text x="500" y="1222" text-anchor="middle" fill="#dbeafe" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="650">discover · verify · align · design · strategize · plan · implement · validate · cohere · finalize</text>
</svg>

