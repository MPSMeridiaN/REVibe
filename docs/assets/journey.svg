<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">From an unfamiliar project to a verified result</title>
  <desc id="desc">Three phases: reconstruct reality through discovery and verification, agree on the target through alignment and design, then implement and challenge the result. Each phase carries evidence and user decisions forward.</desc>
  <rect width="1200" height="500" rx="16" fill="#101d24"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="54" fill="#83d7bd" font-size="16" font-weight="700" letter-spacing="3">REVIBE / UNDERSTAND BEFORE CHANGING</text>
    <text x="48" y="113" fill="#f5f4ed" font-size="38" font-weight="700">Better changes start with better evidence.</text>
    <path d="M48 147H1152" stroke="#35464e"/>
    <text x="48" y="201" fill="#83d7bd" font-size="18">01 / RECONSTRUCT</text>
    <text x="48" y="245" fill="#f5f4ed" font-size="28" font-weight="700">Find the actual system.</text>
    <text x="48" y="286" fill="#c0ccd0" font-size="20">Inventory the feature surface.</text>
    <text x="48" y="317" fill="#c0ccd0" font-size="20">Trace and reproduce behavior.</text>
    <text x="48" y="360" fill="#83d7bd" font-size="17">Claims → verified findings</text>
    <path d="M411 179V371" stroke="#35464e"/>
    <text x="445" y="201" fill="#e6c68b" font-size="18">02 / RECONCILE</text>
    <text x="445" y="245" fill="#f5f4ed" font-size="28" font-weight="700">Agree on the target.</text>
    <text x="445" y="286" fill="#c0ccd0" font-size="20">Confirm what should change.</text>
    <text x="445" y="317" fill="#c0ccd0" font-size="20">Design its system-wide impact.</text>
    <text x="445" y="360" fill="#e6c68b" font-size="17">Recommendations → decisions</text>
    <path d="M810 179V371" stroke="#35464e"/>
    <text x="844" y="201" fill="#a7c6f0" font-size="18">03 / REALIZE</text>
    <text x="844" y="245" fill="#f5f4ed" font-size="28" font-weight="700">Earn confidence.</text>
    <text x="844" y="286" fill="#c0ccd0" font-size="20">Plan and coordinate changes.</text>
    <text x="844" y="317" fill="#c0ccd0" font-size="20">Challenge, cohere, finalize.</text>
    <text x="844" y="360" fill="#a7c6f0" font-size="17">Implementation → verified result</text>
    <rect x="48" y="409" width="1104" height="49" rx="8" fill="#20343b"/>
    <circle cx="73" cy="434" r="5" fill="#83d7bd"/>
    <text x="93" y="441" fill="#e1e9e8" font-size="18">At every stage: review together · preserve evidence · carry decisions forward</text>
  </g>
</svg>
