<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">A handoff, not a memory test</title>
  <desc id="desc">Evidence and user decisions enter one reviewed handoff. The next stage reads the saved state. A correction marks dependent work stale, requiring revalidation before reuse.</desc>
  <rect width="1200" height="440" rx="16" fill="#f4f3ec"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="57" fill="#243d42" font-size="16" font-weight="700" letter-spacing="3">CONTINUITY / ONE REVIEWED STATE</text>
    <text x="48" y="111" fill="#101d24" font-size="36" font-weight="700">The next stage starts where the evidence ends.</text>
    <rect x="48" y="151" width="291" height="161" rx="10" fill="#e1e9e4"/>
    <text x="71" y="187" fill="#173d37" font-size="22" font-weight="700">Traceable inputs</text>
    <text x="71" y="225" fill="#33484b" font-size="19">Findings + source + confidence</text>
    <text x="71" y="257" fill="#33484b" font-size="19">User choices + open questions</text>
    <text x="71" y="289" fill="#33484b" font-size="19">Dependencies + limitations</text>
    <path d="M354 230H415m-11-8 11 8-11 8" fill="none" stroke="#536e70" stroke-width="2"/>
    <rect x="432" y="151" width="336" height="161" rx="10" fill="#183137"/>
    <text x="456" y="187" fill="#f4f3ec" font-size="22" font-weight="700">Reviewed handoff</text>
    <text x="456" y="225" fill="#d4e4df" font-size="19">Compact canonical project state</text>
    <text x="456" y="257" fill="#d4e4df" font-size="19">Durable stage result</text>
    <text x="456" y="289" fill="#83d7bd" font-size="19">Confirmed ≠ merely proposed</text>
    <path d="M783 230H844m-11-8 11 8-11 8" fill="none" stroke="#536e70" stroke-width="2"/>
    <rect x="861" y="151" width="291" height="161" rx="10" fill="#e1e9e4"/>
    <text x="884" y="187" fill="#173d37" font-size="22" font-weight="700">Next stage</text>
    <text x="884" y="225" fill="#33484b" font-size="19">Check freshness.</text>
    <text x="884" y="257" fill="#33484b" font-size="19">Load relevant evidence.</text>
    <text x="884" y="289" fill="#33484b" font-size="19">Continue from stored decisions.</text>
    <path d="M1007 326V358H194V326" fill="none" stroke="#947044" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="286" y="340" width="628" height="36" fill="#f4f3ec"/>
    <text x="306" y="364" fill="#79582f" font-size="19">Correction → mark dependent work stale → reconcile before reuse</text>
    <text x="48" y="411" fill="#596d6e" font-size="17">A new session reads the saved handoff. It does not have to trust the previous conversation.</text>
  </g>
</svg>
